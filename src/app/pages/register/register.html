<!-- S3 : email, mot de passe, confirmation, gestion des erreurs -->
<h1>Créer un compte</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Email <input type="email" formControlName="email"></label>
  <label>Mot de passe <input type="password" formControlName="password"></label>
  <label>Confirmation <input type="password" formControlName="confirm"></label>

  @if (form.hasError('mismatch') && form.controls.confirm.touched) {
    <p class="error">Mots de passe différents</p>
  }
  @if (error(); as message) { <p class="error">{{ message }}</p> }

  <button type="submit">S'inscrire</button>
</form>
<p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
