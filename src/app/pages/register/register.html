<h1>Créer un compte</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Email <input type="email" formControlName="email" autocomplete="email"></label>
  <label>Mot de passe <input type="password" formControlName="password" autocomplete="new-password"></label>
  <label>Confirmation <input type="password" formControlName="confirm" autocomplete="new-password"></label>

  @if (form.hasError('mismatch') && form.controls.confirm.touched) {
    <p class="error">Les mots de passe sont différents.</p>
  }
  @if (error(); as message) { <p class="error">{{ message }}</p> }

  <button type="submit" [disabled]="loading()">S'inscrire</button>
</form>
<p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
