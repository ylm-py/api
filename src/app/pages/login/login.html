<h1>Connexion</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Email <input type="email" formControlName="email"></label>
  <label>Mot de passe <input type="password" formControlName="password"></label>

  @if (error(); as message) { <p class="error">{{ message }}</p> }
  @if (info(); as message) { <p class="info">{{ message }}</p> }

  <button type="submit">Se connecter</button>
  <!-- Mini défi S3-2 : connexion avec Google -->
  <button type="button" class="secondary" (click)="google()">Continuer avec Google</button>
  <!-- Mini défi S3-1 : mot de passe oublié -->
  <button type="button" class="link" (click)="forgot()">Mot de passe oublié ?</button>
</form>
<p>Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
